[project]
site_name = "nonebot-plugin-1password"
site_url = "https://BalconyJH.github.io/nonebot-plugin-1password/"
site_description = "1Password credential workflows and SecretOps for NoneBot2"
site_author = "BalconyJH"
repo_url = "https://github.com/BalconyJH/nonebot-plugin-1password"
repo_name = "BalconyJH/nonebot-plugin-1password"
docs_dir = "docs"
site_dir = "site"
watch = ["CHANGELOG.md"]
strict = true
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ] },
  { "Guides" = [
    { "Catalog" = "guides/catalog.md" },
    { "Permissions" = "guides/permissions.md" },
    { "Request Workflow" = "guides/request-workflow.md" },
    { "Approvals" = "guides/approvals.md" },
    { "Action" = "guides/actions.md" },
    { "Operations" = "guides/operations.md" },
  ] },
  { "Security" = [
    { "Threat Model" = "security/threat-model.md" },
    { "Secret Boundaries" = "security/secret-boundaries.md" },
    { "Service Account" = "security/service-account.md" },
    { "Logging and Redaction" = "security/logging-and-redaction.md" },
    { "Incident Response" = "security/incident-response.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/commands.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Catalog Schema" = "reference/catalog-schema.md" },
    { "Policy Schema" = "reference/policy-schema.md" },
    { "Permission Resources" = "reference/permissions.md" },
    { "Public API" = "reference/public-api.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "Development" = [
    { "Architecture" = "development/architecture.md" },
    { "Typing" = "development/typing.md" },
    { "Testing" = "development/testing.md" },
    { "Documentation" = "development/documentation.md" },
    { "Release" = "development/release.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_source = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["CHANGELOG.md"]
check_paths = true
restrict_base_path = true
url_download = false
