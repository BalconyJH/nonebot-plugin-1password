name: Publish (TestPyPI)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testpypi
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build preview distributions
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Verify the release candidate
        run: make check workflow-lint secret-scan
      - name: Set a unique development version in the disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(uv version --short --frozen)
          preview_version="$base_version.dev$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
          uv version --no-sync "$preview_version"
          make sync build
          echo "TestPyPI candidate: $preview_version" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verified preview distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nonebot-plugin-1password
    permissions:
      id-token: write # Exchange OIDC for a short-lived TestPyPI credential.
    steps:
      - name: Download verified preview distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: dist/
      - name: Publish preview with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          packages-dir: dist/
