name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish or recover.
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Validate release request
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be exactly vX.Y.Z."
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch &&
                "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" &&
                "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Dispatch from the default branch or the matching tag."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and default-branch ancestry
        id: verify
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$source_sha"
          git merge-base --is-ancestor "$source_sha" "refs/remotes/origin/$DEFAULT_BRANCH"
          project_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$project_version"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  ci:
    name: Validate package
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  coverage:
    name: Validate compatibility
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  prek:
    name: Validate repository
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/prek.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  docs:
    name: Validate documentation
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  publish:
    name: Publish to PyPI
    needs: [ci, coverage, prek, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-1password
    permissions:
      id-token: write # Exchange OIDC for a short-lived PyPI credential.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.run_id }}
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist/

  github-release:
    name: Publish GitHub Release
    needs: [source, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create a release from the already verified tag.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.run_id }}
          path: dist/
      - name: Create release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --generate-notes
