name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        description: Verified release commit to check.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          enable-cache: ${{ inputs.source-sha == '' }}
      - name: Lint, type completeness, and release metadata
        run: make lint typecheck changelog-check

  package:
    name: Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          enable-cache: ${{ inputs.source-sha == '' }}
      - name: Build and inspect distributions
        run: make build
      - name: Retain verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  result:
    name: Required Checks
    if: always()
    needs: [quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI layer
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PACKAGE_RESULT" = success
