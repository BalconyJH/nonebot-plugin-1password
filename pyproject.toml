[project]
name = "nonebot-plugin-1password"
version = "0.5.0"
description = "Typed 1Password access workflow and SecretOps integration for NoneBot2"
readme = "README.md"
license = "MIT"
authors = [
    { name = "BalconyJH", email = "balconyjh@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "nonebot-plugin-alconna>=0.62.0,<1.0.0",
    "nonebot-plugin-localstore>=0.7.0,<1.0.0",
    "nonebot-plugin-orm[sqlite]>=0.8.0,<1.0.0",
    "nonebot-plugin-permission>=0.3.0,<1.0.0",
    "nonebot-plugin-uninfo>=0.11.0,<1.0.0",
    "nonebot-plugin-waiter>=0.8.0,<1.0.0",
    "nonebot2>=2.5.0,<3.0.0",
    "onepassword-sdk>=0.4.0,<0.5.0",
    "pydantic>=2.11.0,<3.0.0",
    "tomli>=2.2.1 ; python_full_version < '3.11'",
    "typing-extensions>=4.12.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonebot_plugin_1password"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
exclude = [
    "/tests",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "nonebot-adapter-milky>=1.2.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot2[fastapi, httpx, aiohttp]>=2.5.0",
    "ruff>=0.15.0",
    "ty>=0.0.30",
]
docs = [
    "mkdocstrings-python>=2.0.0",
    "zensical>=0.0.50",
]
release = [
    "build>=1.2.0,<2.0.0",
    "towncrier>=25.8.0",
    "twine>=6.0.0,<7.0.0",
]
test = [
    "cryptography>=46.0.0,<49.0.0",
    "nonebug>=0.4.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "E501", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"src/nonebot_plugin_1password/__init__.py" = ["E402"]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["nonebot_plugin_1password"]
combine-as-imports = true

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist"]
stubPath = "typings"
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
failOnWarnings = true
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportUnreachable = "error"
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
deprecated = "ignore"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nonebot_plugin_1password"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    '\.\.\.',
]
show_missing = true

[tool.nonebot]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12" },
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
nonebot-adapter-milky = [
    { name = "Milky", module_name = "nonebot.adapters.milky" },
]

[tool.nonebot.plugins]
"@local" = ["nonebot_plugin_1password"]
